name: Cold leady

# Leady do cold maili StykDesign: CEIDG + Claude Haiku, w chmurze GitHuba (publiczne repo = minuty za darmo).
# Repo jest PUBLICZNE, więc:
#   - log i podsumowanie zawierają tylko liczby,
#   - plik z leadami jest szyfrowany hasłem z sekretu LEADY_HASLO (AES-256, PBKDF2) przed wysłaniem jako artefakt,
#   - stan w cache trzyma tylko numery CEIDG i skróty SHA-256 maili.
# Partia = 500 leadów na jeden dzień roboczy, zbierana w kilku kolejnych przebiegach.
# CEIDG daje realnie ok. 250 zapytań/h (przerwy serwisowe), więc 500 leadów to ok. 15 h pracy na partię.
# Start co 3 godziny, całą dobę i w weekend (minuty w publicznym repo są darmowe). Przebiegi idą po kolei (concurrency),
# a przebieg, który zastanie pełną partię, kończy się po minucie. Weekendowe przebiegi zbierają na poniedziałek.
on:
  schedule:
    - cron: '13 */3 * * *'
  workflow_dispatch:
    inputs:
      tryb:
        description: 'sonda = test połączenia z CEIDG (bez Claude); dzien = zbieranie leadów'
        required: true
        type: choice
        options: [dzien, sonda]
      cel:
        description: 'Ile leadów na partię (dzień roboczy)'
        required: false
        default: '500'
        type: string

permissions:
  contents: read

concurrency:
  group: cold-leady
  cancel-in-progress: false

jobs:
  leady:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "anthropic>=0.80" "dnspython>=2.6"
      - name: Sprawdź sekrety
        env:
          A: ${{ secrets.CEIDG_TOKEN }}
          B: ${{ secrets.ANTHROPIC_API_KEY }}
          C: ${{ secrets.LEADY_HASLO }}
        run: |
          [ -n "$A" ] || { echo "Brak sekretu CEIDG_TOKEN"; exit 1; }
          [ -n "$B" ] || { echo "Brak sekretu ANTHROPIC_API_KEY"; exit 1; }
          [ -n "$C" ] || { echo "Brak sekretu LEADY_HASLO (bez niego nie zaszyfruję pliku)"; exit 1; }
      - name: Wczytaj stan
        uses: actions/cache/restore@v4
        with:
          path: stan
          key: cold-stan-${{ github.run_id }}
          restore-keys: cold-stan-
      - name: Zbierz leady
        env:
          CEIDG_TOKEN: ${{ secrets.CEIDG_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CEL_LEADOW: ${{ inputs.cel || '500' }}
          MILLIONVERIFIER_API_KEY: ${{ secrets.MILLIONVERIFIER_API_KEY }}
          MAKS_MINUT: '320'
          LIMIT_USD: '0.50'
          MV_LIMIT: '1500'
        run: python ceidg_cold.py ${{ inputs.tryb || 'dzien' }}
      - name: Zapisz stan
        if: always() && (inputs.tryb || 'dzien') == 'dzien'
        uses: actions/cache/save@v4
        with:
          path: stan
          key: cold-stan-${{ github.run_id }}
      - name: Zaszyfruj plik z leadami
        if: always() && (inputs.tryb || 'dzien') == 'dzien'
        env:
          LEADY_HASLO: ${{ secrets.LEADY_HASLO }}
        run: |
          mkdir -p wysylka
          shopt -s nullglob
          for f in wynik/*.csv; do
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$f" -out "wysylka/$(basename "$f").enc" -pass env:LEADY_HASLO
            shred -u "$f"
          done
          cp wynik/*.json wysylka/ 2>/dev/null || true
          ls wysylka
      - name: Wyślij zaszyfrowany plik
        if: always() && (inputs.tryb || 'dzien') == 'dzien'
        uses: actions/upload-artifact@v4
        with:
          name: leady-${{ github.run_id }}
          path: wysylka/
          retention-days: 30
          if-no-files-found: ignore
